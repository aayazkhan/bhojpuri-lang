name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Run every example
        run: for f in examples/*.bhoj; do echo "== $f"; node bin/bhojpuri.js "$f"; done

  # Enforces the Git Flow rules from CONTRIBUTING.md on pull requests.
  policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Branch follows Git Flow
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          case "$BASE_REF" in
            main)    pattern='^(release|hotfix)/[0-9]+\.[0-9]+\.[0-9]+$' ;;
            develop) pattern='^(feature|fix|chore|docs)/[a-z0-9._-]+$|^main$|^(release|hotfix)/[0-9]+\.[0-9]+\.[0-9]+$' ;;
            *)       pattern='^(feature|fix|chore|docs)/[a-z0-9._-]+$' ;;  # stacked PRs
          esac
          if ! echo "$HEAD_REF" | grep -Eq "$pattern"; then
            echo "::error::Branch '$HEAD_REF' can't be merged into '$BASE_REF'. See CONTRIBUTING.md."
            exit 1
          fi
      - name: CHANGELOG.md was updated
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Back-merges of main into develop only carry already-documented changes.
          if [ "$HEAD_REF" = "main" ]; then exit 0; fi
          if ! git diff --name-only "origin/$BASE_REF...HEAD" | grep -qx 'CHANGELOG.md'; then
            echo "::error::Please add an entry to CHANGELOG.md under [Unreleased]."
            exit 1
          fi
