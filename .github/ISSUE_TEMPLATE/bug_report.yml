name: Bug report
description: Something in the language, the CLI or the playground doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! A short program that shows the problem helps most.
        Tip: in the playground, **Baantaw 🔗** copies a link to your code.
  - type: textarea
    id: program
    attributes:
      label: Program
      description: The Bhojpuri Lang code that shows the problem (or a playground link).
      render: text
      placeholder: |
        ka ho bhaiya
          bol ho 1 + 1;
        chalat bani bhaiya
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: The output or error you got. Paste it exactly.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did you run it?
      options:
        - Playground (website)
        - CLI (bhojpuri file.bhoj)
        - Interactive prompt (bhojpuri with no file)
        - As a library (import from @aayazk/bhojpuri-lang)
        - VS Code extension
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`bhojpuri --version`, or \"playground\". For the CLI, also your Node.js version (`node --version`)."
      placeholder: 0.6.0, Node 22
